# Mutiny campaign defaults — sample OpenAI Agents SDK project
# Local CLI loads .mutiny/adapter.py and policy.yaml from this directory.
# --hosted uploads redacted results; Hosted treats project_path as metadata only.

population_size: 8
max_generations: 6
elite_count: 2
max_turns: 4
stop_on_first_violation: true
rng_seed: 5

hosted:
  api_url: "http://127.0.0.1:8000"
  ui_url: "http://127.0.0.1:3000"
