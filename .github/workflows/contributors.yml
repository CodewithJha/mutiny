# Keeps the README contributors gallery in sync with commit authors.
# Avoids contrib.rocks CDN lag and the incomplete /contributors stats cache.
name: Update contributors

on:
  push:
    branches: [main]
    paths-ignore:
      # Avoid a loop when this workflow commits README-only updates.
      - "README.md"
  schedule:
    # Safety net if a push run is skipped or the API lags briefly after merge.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contributors:
    runs-on: ubuntu-latest
    name: Refresh README contributors
    # This job commits the generated README gallery back to main.
    permissions:
      contents: write
    steps:
      # Keep checkout credentials here for the final git push.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rebuild contributors gallery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/update_contributors.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh README contributors gallery"
          git push
