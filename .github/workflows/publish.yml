# Publish mutiny-core → mutiny-openai-agents → mutiny-ai to PyPI.
# Preferred auth: Trusted Publishing (OIDC). Fallback: UV_PUBLISH_TOKEN secret.
#
# One-time PyPI setup (before first upload of a new project, or for OIDC):
#   https://pypi.org/manage/account/publishing/
#   Add a publisher for EACH of: mutiny-core, mutiny-openai-agents, mutiny-ai
#     Owner: CodewithJha
#     Repository: mutiny
#     Workflow: publish.yml
#     Environment: pypi
#
# Or create an API token and set repo secret UV_PUBLISH_TOKEN (pypi-...).
#
# Then: Actions → Publish to PyPI → Run workflow
#   or: create a GitHub Release
#
# Already-published versions FAIL the job (no silent skip). Bump all three
# package versions together before re-running.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and upload
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mutiny-ai/
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Assert publishable versions aligned
        run: |
          set -euo pipefail
          version_of() {
            grep -E '^version[[:space:]]*=' "$1/pyproject.toml" | head -1 | sed -E 's/.*"([^"]+)".*/\1/'
          }
          core_v="$(version_of packages/mutiny_core)"
          openai_v="$(version_of packages/mutiny_openai_agents)"
          cli_v="$(version_of packages/mutiny_cli)"
          echo "versions: core=${core_v} openai=${openai_v} cli=${cli_v}"
          test -n "$core_v"
          test "$core_v" = "$openai_v"
          test "$core_v" = "$cli_v"
          # Refuse publishing the historical alpha line as a "new" 0.2+ ship without a bump.
          if [ "$core_v" = "0.1.0" ]; then
            echo "error: refusing to publish 0.1.0 — bump packages to the intended release (e.g. 0.2.0)" >&2
            exit 1
          fi

      - name: Verify release artifacts (isolated install)
        env:
          MUTINY_SAMPLE_OFFLINE: "1"
          OPENAI_API_KEY: ""
          FEATHERLESS_API_KEY: ""
        run: |
          set -euo pipefail
          chmod +x scripts/verify_release_artifacts.sh
          ./scripts/verify_release_artifacts.sh "${RUNNER_TEMP}/mutiny-prepublish-artifacts"

      - name: Publish packages
        env:
          # May be empty when the secret is unset — never leave an empty token
          # in the environment while using Trusted Publishing (uv rejects that).
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          publish_pkg() {
            local dir="$1"
            local pypi_name="$2"
            local out="$3"
            local version
            version="$(grep -E '^version[[:space:]]*=' "$dir/pyproject.toml" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"

            echo "==> ${pypi_name}==${version}"

            if curl -fsSL "https://pypi.org/pypi/${pypi_name}/${version}/json" >/dev/null 2>&1; then
              echo "error: ${pypi_name}==${version} already on PyPI — bump version to ship new code (no silent skip)" >&2
              exit 1
            fi

            rm -rf "$out"
            uv build --out-dir "$out" "$dir"

            if [ -n "${UV_PUBLISH_TOKEN:-}" ]; then
              uv publish --token "$UV_PUBLISH_TOKEN" "$out"/*
            else
              # Empty UV_PUBLISH_TOKEN / TWINE_* must not be set or uv errors with:
              # "a username and a password are not allowed when using trusted publishing"
              unset UV_PUBLISH_TOKEN UV_PUBLISH_USERNAME UV_PUBLISH_PASSWORD \
                TWINE_USERNAME TWINE_PASSWORD || true
              uv publish --trusted-publishing always "$out"/*
            fi
          }

          publish_pkg packages/mutiny_core mutiny-core dist/core
          publish_pkg packages/mutiny_openai_agents mutiny-openai-agents dist/openai
          publish_pkg packages/mutiny_cli mutiny-ai dist/cli

      - name: Verify on PyPI
        run: |
          set -euo pipefail
          version_of() {
            grep -E '^version[[:space:]]*=' "$1/pyproject.toml" | head -1 | sed -E 's/.*"([^"]+)".*/\1/'
          }
          verify_pkg() {
            local dir="$1"
            local pypi_name="$2"
            local version
            version="$(version_of "$dir")"
            if curl -fsSL "https://pypi.org/pypi/${pypi_name}/${version}/json" >/dev/null; then
              echo "ok ${pypi_name} ${version}"
            else
              echo "missing ${pypi_name} ${version}" >&2
              exit 1
            fi
          }
          verify_pkg packages/mutiny_core mutiny-core
          verify_pkg packages/mutiny_openai_agents mutiny-openai-agents
          verify_pkg packages/mutiny_cli mutiny-ai
