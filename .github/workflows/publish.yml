# Publish mutiny-core → mutiny-openai-agents → mutiny-ai to PyPI.
# Preferred auth: Trusted Publishing (OIDC). Fallback: UV_PUBLISH_TOKEN secret.
#
# One-time PyPI setup (before first upload of a new project, or for OIDC):
#   https://pypi.org/manage/account/publishing/
#   Add a publisher for EACH of: mutiny-core, mutiny-openai-agents, mutiny-ai
#     Owner: CodewithJha
#     Repository: mutiny
#     Workflow: publish.yml
#     Environment: pypi
#
# Or create an API token and set repo secret UV_PUBLISH_TOKEN (pypi-...).
#
# Then: Actions → Publish to PyPI → Run workflow
#   or: create a GitHub Release
#
# Already-published versions are skipped (idempotent), so re-running a release
# that was uploaded manually still reports success.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and upload
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mutiny-ai/
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Publish packages
        env:
          # May be empty when the secret is unset — never leave an empty token
          # in the environment while using Trusted Publishing (uv rejects that).
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          publish_pkg() {
            local dir="$1"
            local pypi_name="$2"
            local out="$3"
            local version
            version="$(grep -E '^version[[:space:]]*=' "$dir/pyproject.toml" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"

            echo "==> ${pypi_name}==${version}"

            if curl -fsSL "https://pypi.org/pypi/${pypi_name}/${version}/json" >/dev/null 2>&1; then
              echo "Already on PyPI — skip upload"
              return 0
            fi

            rm -rf "$out"
            uv build --out-dir "$out" "$dir"

            if [ -n "${UV_PUBLISH_TOKEN:-}" ]; then
              uv publish --token "$UV_PUBLISH_TOKEN" "$out"/*
            else
              # Empty UV_PUBLISH_TOKEN / TWINE_* must not be set or uv errors with:
              # "a username and a password are not allowed when using trusted publishing"
              unset UV_PUBLISH_TOKEN UV_PUBLISH_USERNAME UV_PUBLISH_PASSWORD \
                TWINE_USERNAME TWINE_PASSWORD || true
              uv publish --trusted-publishing always "$out"/*
            fi
          }

          publish_pkg packages/mutiny_core mutiny-core dist/core
          publish_pkg packages/mutiny_openai_agents mutiny-openai-agents dist/openai
          publish_pkg packages/mutiny_cli mutiny-ai dist/cli

      - name: Verify on PyPI
        run: |
          set -euo pipefail
          for pkg in mutiny-core mutiny-openai-agents mutiny-ai; do
            if curl -fsSL "https://pypi.org/pypi/${pkg}/0.1.0/json" >/dev/null; then
              echo "ok ${pkg} 0.1.0"
            else
              echo "missing ${pkg} 0.1.0" >&2
              exit 1
            fi
          done
