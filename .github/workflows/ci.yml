name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync --extra dev

      - name: Unit tests
        run: uv run pytest tests/unit -q --tb=short
        env:
          # Sample agent falls back to offline scripted model without a key.
          MUTINY_SAMPLE_OFFLINE: "1"
