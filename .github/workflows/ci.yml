name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Normal PR CI is offline: sample agent + template smoke; no Hosted/LLM secrets.
env:
  MUTINY_SAMPLE_OFFLINE: "1"

jobs:
  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace
        run: uv sync --locked --group dev

      - name: Python lint
        run: uv run --locked ruff check

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync --group dev

      - name: Unit tests
        run: uv run pytest tests/unit -q --tb=short
        env:
          MUTINY_DB_PATH: ${{ runner.temp }}/mutiny-unit-${{ matrix.python-version }}.sqlite

      - name: Integration tests
        run: uv run pytest tests/integration -q --tb=short
        env:
          MUTINY_DB_PATH: ${{ runner.temp }}/mutiny-integration-${{ matrix.python-version }}.sqlite

      - name: Reliability tests
        run: uv run pytest tests/reliability -q --tb=short
        env:
          MUTINY_DB_PATH: ${{ runner.temp }}/mutiny-reliability-${{ matrix.python-version }}.sqlite

  cli-smoke:
    name: cli-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --group dev

      - name: Local CLI smoke (sample project)
        working-directory: examples/openai_support_agent
        env:
          # M-PR2: local path only — do not pass --hosted / --hosted-url.
          MUTINY_SAMPLE_OFFLINE: "1"
          # Ensure offline scripted model even if a runner secret leaked in.
          OPENAI_API_KEY: ""
          FEATHERLESS_API_KEY: ""
        run: |
          set -euo pipefail
          uv run mutiny --help >/dev/null
          uv run mutiny init
          uv run mutiny run

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  container-smoke:
    name: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MUTINY_API_TOKEN: container-ci-dummy-token
      COMPOSE_PROJECT_NAME: mutiny-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start production images
        run: docker compose up --build -d

      - name: Check readiness and container boundaries
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/api/health
          curl --fail --silent http://127.0.0.1:3000 >/dev/null
          # Same-origin proxy must reach the API and inject the runtime token.
          curl --fail http://127.0.0.1:3000/api/campaigns
          docker compose exec -T api sh -c 'test "$(id -u)" = 10001 && test -w /app/data && test ! -w /app/.venv && test ! -w /app/examples'
          docker compose exec -T web sh -c 'test "$(id -u)" != 0'
          # The named volume is the only API mount; web has no host mounts.
          test "$(docker inspect --format '{{len .Mounts}}' "$(docker compose ps -q api)")" = 1
          test "$(docker inspect --format '{{(index .Mounts 0).Type}}' "$(docker compose ps -q api)")" = volume
          test "$(docker inspect --format '{{len .Mounts}}' "$(docker compose ps -q web)")" = 0

      - name: Confirm missing token fails before listen
        run: |
          set +e
          timeout 15 docker compose run --rm --no-deps -e MUTINY_API_TOKEN= api
          status=$?
          test "$status" = 2

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up test containers and data
        if: always()
        run: docker compose down -v

  package-build:
    name: package-build
    runs-on: ubuntu-latest
    # Release integrity gate: source packaging tests → build → isolated install →
    # CLI smoke. Catches the stale-PyPI class of failure (checkout ≠ wheel).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --group dev

      - name: Packaging unit tests
        run: uv run pytest tests/unit/test_package_release.py -q --tb=short

      - name: Release artifact gate (build + isolated install + offline CLI)
        env:
          MUTINY_SAMPLE_OFFLINE: "1"
          OPENAI_API_KEY: ""
          FEATHERLESS_API_KEY: ""
        run: |
          set -euo pipefail
          chmod +x scripts/verify_release_artifacts.sh
          ./scripts/verify_release_artifacts.sh "${RUNNER_TEMP}/mutiny-release-artifacts"
