name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Normal PR CI is offline: sample agent + template smoke; no Hosted/LLM secrets.
env:
  MUTINY_SAMPLE_OFFLINE: "1"

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync --extra dev

      - name: Unit tests
        run: uv run pytest tests/unit -q --tb=short
        env:
          MUTINY_DB_PATH: ${{ runner.temp }}/mutiny-unit-${{ matrix.python-version }}.sqlite

      - name: Integration tests
        run: uv run pytest tests/integration -q --tb=short
        env:
          MUTINY_DB_PATH: ${{ runner.temp }}/mutiny-integration-${{ matrix.python-version }}.sqlite

      - name: Reliability tests
        run: uv run pytest tests/reliability -q --tb=short
        env:
          MUTINY_DB_PATH: ${{ runner.temp }}/mutiny-reliability-${{ matrix.python-version }}.sqlite

  cli-smoke:
    name: cli-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --extra dev

      - name: Local CLI smoke (sample project)
        working-directory: examples/openai_support_agent
        env:
          # M-PR2: local path only — do not pass --hosted / --hosted-url.
          MUTINY_SAMPLE_OFFLINE: "1"
          # Ensure offline scripted model even if a runner secret leaked in.
          OPENAI_API_KEY: ""
          FEATHERLESS_API_KEY: ""
        run: |
          set -euo pipefail
          uv run mutiny --help >/dev/null
          uv run mutiny init
          uv run mutiny run

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  package-build:
    name: package-build
    runs-on: ubuntu-latest
    # Release integrity gate: source packaging tests → build → isolated install →
    # CLI smoke. Catches the stale-PyPI class of failure (checkout ≠ wheel).
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --extra dev

      - name: Packaging unit tests
        run: uv run pytest tests/unit/test_package_release.py -q --tb=short

      - name: Release artifact gate (build + isolated install + offline CLI)
        env:
          MUTINY_SAMPLE_OFFLINE: "1"
          OPENAI_API_KEY: ""
          FEATHERLESS_API_KEY: ""
        run: |
          set -euo pipefail
          chmod +x scripts/verify_release_artifacts.sh
          ./scripts/verify_release_artifacts.sh "${RUNNER_TEMP}/mutiny-release-artifacts"
