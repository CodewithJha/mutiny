[project]
name = "mutiny-openai-agents"
version = "0.1.0"
description = "Mutiny Adapter #1 — OpenAI Agents SDK TargetAdapter"
requires-python = ">=3.11"
dependencies = [
    "mutiny-core",
    "openai-agents>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutiny_openai_agents"]
