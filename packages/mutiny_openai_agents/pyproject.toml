[project]
name = "mutiny-openai-agents"
version = "0.1.0"
description = "Mutiny Adapter #1 — OpenAI Agents SDK TargetAdapter"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Priyanshu Jha", email = "155089480+CodewithJha@users.noreply.github.com" },
]
dependencies = [
    "mutiny-core>=0.1.0",
    "openai-agents>=0.19",
]

[project.urls]
Homepage = "https://github.com/CodewithJha/mutiny"
Repository = "https://github.com/CodewithJha/mutiny"
Issues = "https://github.com/CodewithJha/mutiny/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutiny_openai_agents"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/pyproject.toml",
]
