[project]
name = "mutiny-cli"
version = "0.1.0"
description = "Mutiny CLI — mutiny init / mutiny run / mutiny test"
requires-python = ">=3.11"
dependencies = [
    "mutiny-core",
    "mutiny-openai-agents",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
mutiny = "mutiny_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutiny_cli"]
