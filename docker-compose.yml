services:
  api:
    build:
      context: .
      target: api
    volumes:
      - mutiny-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Honored by mutiny_api.db.resolve_db_path (M-PR4).
      - MUTINY_DB_PATH=/app/data/mutiny.sqlite
      # Required for --host 0.0.0.0 (P0-1/P0-4). Empty/unset → process refuses to start.
      # Set the same value on `web` so the Next rewrite can inject Authorization.
      - MUTINY_API_TOKEN=${MUTINY_API_TOKEN:?set MUTINY_API_TOKEN for non-loopback Hosted}
  web:
    build:
      context: .
      target: web
      args:
        MUTINY_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    environment:
      # Same token as `api` so middleware can inject Authorization on rewrites.
      # Use the Docker service hostname — 127.0.0.1 is wrong inside this container.
      - MUTINY_API_TOKEN=${MUTINY_API_TOKEN:?set MUTINY_API_TOKEN for non-loopback Hosted}
      # API destination is set at image build time above.

volumes:
  mutiny-data:
