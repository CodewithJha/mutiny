services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      # Bind-mount keeps MUTINY_DB_PATH (/app/data/...) on the host ./data/
      - .:/app
    command: >
      bash -lc "pip install -q uv && uv sync &&
      PYTHONPATH=apps/api/src:apps/demo_agent/src:packages/mutiny_core/src
      uv run uvicorn mutiny_api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      # Honored by mutiny_api.db.resolve_db_path (M-PR4).
      - MUTINY_DB_PATH=/app/data/mutiny.sqlite
      # M-PR7 (optional): enable single-tenant Bearer auth on protected routes.
      # Uncomment and set the same value on `web` so the Next rewrite can inject it.
      # - MUTINY_API_TOKEN=change-me
  web:
    image: node:22-bookworm
    working_dir: /app/apps/web
    volumes:
      - .:/app
    command: bash -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - WATCHPACK_POLLING=true
      # - MUTINY_API_TOKEN=change-me
      # - MUTINY_API_URL=http://api:8000
