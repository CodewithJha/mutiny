# Mutiny Hosted API — Railway deploy from monorepo root
[build]
builder = "nixpacks"

[deploy]
# Sample .mutiny may be stripped from the image (Docker cannot re-include under
# an excluded .mutiny/ parent). Always ensure adapter exists before uvicorn.
startCommand = "uv sync && mkdir -p data && uv run python scripts/ensure_sample_mutiny.py && uv run uvicorn mutiny_api.main:app --host 0.0.0.0 --port ${PORT:-8000}"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
