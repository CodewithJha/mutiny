# Mutiny Hosted API — Railway deploy from monorepo root
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# The final Dockerfile stage is the API image.

[deploy]
# Non-loopback bind (0.0.0.0) requires MUTINY_API_TOKEN (P0-1/P0-4);
# python -m mutiny_api fails closed before listen if missing/empty.
# Keep the existing sample-ensure step (MUT-066 is separate). The image already
# prepares these files at build time, so this is normally a read-only check.
startCommand = "sh -c 'python scripts/ensure_sample_mutiny.py && exec python -m mutiny_api --host 0.0.0.0 --port ${PORT:-8000}'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
