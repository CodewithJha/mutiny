<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Mutiny loop storyboard</title>
  <desc id="desc">init → run → violation → regression → test → PASS. Drop a real mutiny-demo.gif later.</desc>
  <style>
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .flow { animation: flow 3.6s linear infinite; }
    @keyframes flow { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
  </style>
  <rect width="1280" height="480" fill="#0f1419"/>
  <text x="40" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#e8eef7" font-weight="700">Mutiny loop</text>
  <text x="160" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b9bb4">init → run → violation → regression → test → PASS</text>

  <!-- boxes -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" text-anchor="middle">
    <rect class="pulse" x="40" y="100" width="160" height="100" rx="12" fill="#151d2a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="120" y="145" fill="#7dd3c0">1. init</text>
    <text x="120" y="170" fill="#8b9bb4" font-size="11">scaffold</text>

    <rect class="pulse" x="240" y="100" width="160" height="100" rx="12" fill="#151d2a" stroke="#5b6b84" stroke-width="2" style="animation-delay:0.3s"/>
    <text x="320" y="145" fill="#c5d0e0">2. run</text>
    <text x="320" y="170" fill="#8b9bb4" font-size="11">search</text>

    <rect class="pulse" x="440" y="100" width="160" height="100" rx="12" fill="#1a1520" stroke="#f87171" stroke-width="2" style="animation-delay:0.6s"/>
    <text x="520" y="145" fill="#f87171">3. violation</text>
    <text x="520" y="170" fill="#e8b4c0" font-size="11">code proves</text>

    <rect class="pulse" x="640" y="100" width="160" height="100" rx="12" fill="#151d2a" stroke="#fbbf24" stroke-width="2" style="animation-delay:0.9s"/>
    <text x="720" y="145" fill="#fbbf24">4. regress</text>
    <text x="720" y="170" fill="#8b9bb4" font-size="11">minimize</text>

    <rect class="pulse" x="840" y="100" width="160" height="100" rx="12" fill="#151d2a" stroke="#5b6b84" stroke-width="2" style="animation-delay:1.2s"/>
    <text x="920" y="145" fill="#c5d0e0">5. test</text>
    <text x="920" y="170" fill="#8b9bb4" font-size="11">replay</text>

    <rect class="pulse" x="1040" y="100" width="200" height="100" rx="12" fill="#12241f" stroke="#2dd4bf" stroke-width="2" style="animation-delay:1.5s"/>
    <text x="1140" y="145" fill="#2dd4bf">6. PASS</text>
    <text x="1140" y="170" fill="#7dd3c0" font-size="11">after fix</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#3a4a62" stroke-width="3" stroke-dasharray="6 6" class="flow">
    <path d="M200 150 H240"/>
    <path d="M400 150 H440"/>
    <path d="M600 150 H640"/>
    <path d="M800 150 H840"/>
    <path d="M1000 150 H1040"/>
  </g>

  <rect x="40" y="260" width="1200" height="160" rx="12" fill="#121820" stroke="#2a3a52"/>
  <text x="72" y="310" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#7dd3c0">$ uv run mutiny init &amp;&amp; uv run mutiny run --no-hosted &amp;&amp; uv run mutiny test</text>
  <text x="72" y="350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b9bb4">To drop a real GIF later: record asciinema/terminal → export as docs/assets/mutiny-demo.gif,</text>
  <text x="72" y="378" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b9bb4">then update README to prefer the GIF over this storyboard SVG.</text>
</svg>
