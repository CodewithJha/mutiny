[project]
name = "mutiny-api"
version = "0.1.0"
description = "Mutiny Hosted API — FastAPI + SQLite control plane"
requires-python = ">=3.11"
dependencies = [
    "mutiny-core",
    "demo-agent",
    "mutiny-openai-agents",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutiny_api"]
