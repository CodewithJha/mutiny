[project]
name = "demo-agent"
version = "0.1.0"
description = "Mutiny deliberately vulnerable demo support agent (mock tools only)"
requires-python = ">=3.11"
dependencies = [
    "mutiny-core",
    "pydantic>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_agent"]
